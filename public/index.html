<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GREAT MONEY</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f6;
      color: #123;
    }

    header {
      background: #087f3f;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 5px;
      opacity: .9;
    }

    .container {
      max-width: 480px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      color: #087f3f;
      margin-bottom: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #087f3f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #056331;
    }

    .secondary {
      background: #17365d;
    }

    .danger {
      background: #c62828;
    }

    .link {
      text-align: center;
      margin-top: 15px;
      color: #087f3f;
      cursor: pointer;
    }

    .message {
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      display: none;
      background: #fff3cd;
      color: #664d03;
    }

    .balance {
      background: #087f3f;
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .balance strong {
      display: block;
      font-size: 32px;
      margin-top: 8px;
    }

    .info {
      padding: 15px;
      background: #f1f8f4;
      border-radius: 10px;
      margin-top: 12px;
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>GREAT MONEY</h1>
  <p>Online Registration & Account Management</p>
</header>

<div class="container">

  <!-- HOME -->
  <section id="homeSection" class="card">
    <h2>Welcome to GREAT MONEY</h2>

    <p style="text-align:center; line-height:1.6;">
      Create your account and manage your GREAT MONEY account online.
    </p>

    <button onclick="showRegister()">
      Create Account
    </button>

    <button class="secondary" onclick="showLogin()">
      Login
    </button>
  </section>


  <!-- REGISTER -->
  <section id="registerSection" class="card hidden">
    <h2>Create Account</h2>

    <input
      id="regName"
      type="text"
      placeholder="Full Name"
    >

    <input
      id="regContact"
      type="email"
      placeholder="Email Address"
    >

    <input
      id="regPassword"
      type="password"
      placeholder="Password (minimum 8 characters)"
    >

    <button onclick="registerUser()">
      Register
    </button>

    <div id="registerMessage" class="message"></div>

    <div class="link" onclick="showLogin()">
      Already have an account? Login
    </div>
  </section>


  <!-- LOGIN -->
  <section id="loginSection" class="card hidden">
    <h2>Login</h2>

    <input
      id="loginContact"
      type="email"
      placeholder="Email Address"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="Password"
    >

    <button onclick="loginUser()">
      Login
    </button>
